name: Deploy to IONOS

# Disabled auto-deploy — upload manually first, then run this workflow when ready.
# Future deploys should target a subfolder (e.g. /aethoncg.com), not webspace root.
on:
  workflow_dispatch:

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'
  APP_URL: https://aethoncg.com
  DB_HOST: db5021301145.hosting-data.io
  DB_PORT: '3306'
  IONOS_SSH_HOST: access-5019302200.webspace-host.com
  IONOS_SSH_USERNAME: su1846070
  IONOS_SSH_PATH: /Aethon

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, json, bcmath, openssl, pdo_mysql, tokenizer, fileinfo
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install NPM dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Create production .env
        run: |
          cat > .env << EOF
          APP_NAME=Aethon
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ env.APP_URL }}

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US

          BCRYPT_ROUNDS=12

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=${{ env.DB_HOST }}
          DB_PORT=${{ env.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database

          CACHE_STORE=database

          MAIL_MAILER=log
          MAIL_FROM_ADDRESS="consulting@aethoncg.com"
          MAIL_FROM_NAME="Aethon"

          VITE_APP_NAME="Aethon"

          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ env.APP_URL }}/auth/google/callback
          EOF

      - name: Prepare deployment package (no vendor — run composer on server)
        run: |
          mkdir -p release
          rm -f public/hot
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude 'tests' \
            --exclude '.env.example' \
            --exclude 'database/database.sqlite' \
            --exclude 'release' \
            --exclude 'public/hot' \
            ./ release/

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.IONOS_SSH_HOST }}
          username: ${{ env.IONOS_SSH_USERNAME }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          port: 22
          script: |
            mkdir -p ${{ env.IONOS_SSH_PATH }}

      - name: Deploy to IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ env.IONOS_SSH_HOST }}
          username: ${{ env.IONOS_SSH_USERNAME }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          port: 22
          local_path: ./release/
          remote_path: ${{ env.IONOS_SSH_PATH }}
          sftpArgs: '-o ConnectTimeout=30'

      - name: Post-deploy (composer, migrate, cache)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.IONOS_SSH_HOST }}
          username: ${{ env.IONOS_SSH_USERNAME }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          port: 22
          script: |
            cd ${{ env.IONOS_SSH_PATH }}
            rm -f public/hot
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chmod -R 775 storage bootstrap/cache
